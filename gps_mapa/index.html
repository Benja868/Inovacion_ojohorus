<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>#map{height:100vh;margin:0;padding:0;}</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
    const map = L.map('map').setView([currentLat, currentLon], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'© OSM contributors' }).addTo(map);
    const marker = L.marker([currentLat, currentLon]).addTo(map);

    setInterval(()=>{
    fetch("data.js").then(r=>r.text()).then(js=>{
        eval(js);
        marker.setLatLng([currentLat,currentLon]);
        map.setView([currentLat,currentLon]);
    });
    },2000);
</script>
</body>
</html>
